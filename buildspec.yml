
version: 0.2

phases:
  install:
    commands:
      - echo Installing application dependencies...
      - npm ci --prefix src

  pre_build:
    commands:
      - echo Running automated tests...
      - npm test --prefix src -- --runInBand
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 325657596892.dkr.ecr.us-east-2.amazonaws.com
      - REPOSITORY_URI=325657596892.dkr.ecr.us-east-2.amazonaws.com/myapp-repo
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker images...
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Writing image definitions file...
      - printf '{"ImageURI":"%s"}' $REPOSITORY_URI:$IMAGE_TAG > imageDetail.json
      - cat imageDetail.json

artifacts:
  files:
    - appspec.yml
    - taskdef.json
    - imageDetail.json

reports:
  unit-tests:
    files:
      - junit.xml
    base-directory: src
    file-format: JUNITXML
